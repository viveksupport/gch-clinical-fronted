# nginx.conf: serves the built React app inside the container (port 80)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Smaller downloads
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React Router: any page address (/facebook, /cqc ...) loads index.html,
    # so refreshing a page does not give a 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
